name: CFB margin consensus uncertainty search

on:
  push:
    branches:
      - audit-ncaaf-margin-2026-10-02
    paths:
      - 'research/cfb_margin_consensus_uncertainty_search.py'
      - 'research/cfb_margin_ensemble_edge_quality.py'
      - 'research/cfb_historical_markets.py'
      - '.github/workflows/cfb-margin-consensus-uncertainty-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy
      - name: Run consensus uncertainty search
        env:
          PYTHONUNBUFFERED: '1'
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: '.'
        run: python research/cfb_margin_consensus_uncertainty_search.py
      - name: Commit results
        run: |
          git add research/results/cfb_margin_consensus_uncertainty_search.json research/results/CFB_MARGIN_CONSENSUS_UNCERTAINTY_SEARCH.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: persist consensus uncertainty edge search'
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
