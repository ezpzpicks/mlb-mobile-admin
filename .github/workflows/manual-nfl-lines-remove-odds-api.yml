name: One-time NFL manual market builder

on:
  push:
    paths:
      - ".github/workflows/manual-nfl-lines-remove-odds-api.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate patch script
        run: python -m py_compile scripts/patch_nfl_manual_markets.py

      - name: Patch NFL builder
        run: python scripts/patch_nfl_manual_markets.py

      - name: Verify NFL builder
        shell: bash
        run: |
          python -m py_compile builders/nfl_builder.py
          ! grep -q "the-odds-api.com" builders/nfl_builder.py
          ! grep -q "THE_ODDS_API_KEY" builders/nfl_builder.py
          ! grep -q "_odds_api_prop_lines" builders/nfl_builder.py
          ! grep -q "nfl_yard_inputs_" builders/nfl_builder.py
          grep -q "Manual sportsbook lines and prices" builders/nfl_builder.py
          grep -q "Manual player prop lines" builders/nfl_builder.py
          grep -q "disabled=not game_markets_ready" builders/nfl_builder.py
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make NFL sportsbook markets manual entry only"
          git push
