name: Finalize NFL v4.5 builder label

on:
  push:
    paths:
      - ".github/workflows/finalize-nfl-v45-caption.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update visible builder version label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('builders/nfl_builder.py')
          text = path.read_text(encoding='utf-8')
          old = 'st.caption("NFL v4.4 regression slate • active-game player projections • manual sportsbook entry")'
          new = 'st.caption("NFL v4.5 regression slate • active-game player projections • yardage + Anytime TD entry")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one old caption, found {text.count(old)}')
          text = text.replace(old, new, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit permanent label and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py
          git rm .github/workflows/finalize-nfl-v45-caption.yml
          git commit -m "Finalize NFL v4.5 Anytime TD builder label"
          git push
