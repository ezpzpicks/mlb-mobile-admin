name: NFL season weight audit

on:
  push:
    branches:
      - nfl-season-weight-audit-2026-10-01
    paths:
      - research/nfl_season_weight_audit.py
      - .github/workflows/nfl-season-weight-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyarrow scipy statsmodels
      - name: Run season-weight counterfactual audit
        run: python -m research.nfl_season_weight_audit
      - name: Save auditable results on research branch
        shell: bash
        run: |
          mkdir -p research/results/nfl_season_weight_audit
          cp artifacts/nfl_season_weight_audit/results.json research/results/nfl_season_weight_audit/results.json
          cp artifacts/nfl_season_weight_audit/weight_grid_by_week.csv research/results/nfl_season_weight_audit/weight_grid_by_week.csv
          cp artifacts/nfl_season_weight_audit/multiplier_summary.csv research/results/nfl_season_weight_audit/multiplier_summary.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/nfl_season_weight_audit
          if ! git diff --cached --quiet; then
            git commit -m "Record NFL season-weight audit results"
            git push origin HEAD:nfl-season-weight-audit-2026-10-01
          fi
      - name: Upload full audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: nfl-season-weight-audit-results
          path: artifacts/nfl_season_weight_audit/
          if-no-files-found: error
          retention-days: 14
