name: Turso source cutover

on:
  push:
    branches: [turso-full-cutover]

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-full-cutover
          fetch-depth: 0
      - name: Transform permanent MLB source
        run: python scripts/turso_source_cutover.py
      - name: Commit permanent source cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Replace MLB Google storage with Turso"
          git push origin HEAD:turso-full-cutover
