name: Apply CFB simple spread grades

on:
  push:
    branches: [main]
    paths:
      - "research/apply_cfb_simple_spread_grades.py"
      - ".github/workflows/apply-cfb-simple-spread-grades.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply simple CFB spread grading
        run: python research/apply_cfb_simple_spread_grades.py
      - name: Validate syntax and grading behavior
        run: |
          python -m py_compile builders/cfb_market_calibration.py
          python -c "from builders.cfb_market_calibration import _grade_spread; assert _grade_spread(0.40,5.99,20,0)=='No Play'; assert _grade_spread(0.40,6.0,20,0)=='B Spread'; assert _grade_spread(0.40,9.49,20,0)=='B Spread'; assert _grade_spread(0.40,9.5,20,0)=='A Spread'"
      - name: Commit simplified grading
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/cfb_market_calibration.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Simplify CFB spread grading to edge and price"
          git push origin main
