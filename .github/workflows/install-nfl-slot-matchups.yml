name: Install NFL slot matchup layer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-nfl-slot-matchups.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install NFL slot matchup layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wire slot matchup layer into the NFL builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app_mobile_admin.py')
          text = path.read_text(encoding='utf-8')

          old_import = '    from builders.nfl_skill_prop_consistency import install_skill_prop_consistency\n'
          new_import = old_import + '    from builders.nfl_slot_matchups import install_slot_matchup_layer\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'NFL slot import anchor count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_call = '    install_skill_prop_consistency(nfl_builder)\n'
          new_call = old_call + '    install_slot_matchup_layer(nfl_builder)\n'
          if text.count(old_call) != 1:
              raise SystemExit(f'NFL slot call anchor count={text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)

          old_version = '    "NFL": "nfl-v4.4-active-prop-role-calibration-2026-09-13",\n'
          new_version = '    "NFL": "nfl-v4.6-slot-defense-matchups-2026-09-13",\n'
          if text.count(old_version) != 1:
              raise SystemExit(f'NFL version anchor count={text.count(old_version)}')
          text = text.replace(old_version, new_version, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused validation
        run: |
          python -m pip install --quiet numpy pandas
          python -m py_compile builders/nfl_slot_matchups.py app_mobile_admin.py
          PYTHONPATH=. python research/test_nfl_slot_matchups.py

      - name: Commit permanent source changes
        shell: bash
        run: |
          git config user.name "EZPZ NFL Model Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/install-nfl-slot-matchups.yml
          git add app_mobile_admin.py builders/nfl_slot_matchups.py research/test_nfl_slot_matchups.py
          git commit -m "Enable NFL slot-specific defensive learning"
          git push origin HEAD:main
