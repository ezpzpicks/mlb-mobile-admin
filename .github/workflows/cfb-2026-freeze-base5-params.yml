name: CFB freeze 2026 base5 params
on:
  push:
    branches: [audit-ncaaf-margin-2026-10-02]
    paths:
      - 'research/cfb_2026_base5_frozen_params.py'
      - '.github/workflows/cfb-2026-freeze-base5-params.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy pyreadr
      - name: Freeze params
        env:
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: '.'
        run: python research/cfb_2026_base5_frozen_params.py
      - name: Commit results
        run: |
          git add research/results/cfb_2026_base5_frozen_params.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: persist frozen CFB base5 params'
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
