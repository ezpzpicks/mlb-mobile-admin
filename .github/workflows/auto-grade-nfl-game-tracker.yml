name: Auto-grade NFL game tracker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-grade-nfl-game-tracker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add automatic game-result grading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("builders/nfl_builder.py")
          text = path.read_text()

          insert = r'''
def _game_teams_from_label(value: Any) -> tuple[str, str]:
    """Recover away/home abbreviations from the tracker game label."""
    game = _safe_text(value)
    if not game:
        return "", ""
    parts = re.split(r"\s+(?:at|@|vs\.?)+\s+", game, maxsplit=1, flags=re.IGNORECASE)
    if len(parts) != 2:
        return "", ""
    return _normalize_team(parts[0]), _normalize_team(parts[1])


def _grade_completed_game_bet(row: pd.Series | dict[str, Any], game_row: pd.Series | dict[str, Any]) -> str:
    """Grade one saved NFL game wager from the final score."""
    away_team = _normalize_team(game_row.get("Away Team", ""))
    home_team = _normalize_team(game_row.get("Home Team", ""))
    away_score = _num(game_row.get("Away Score", np.nan), np.nan)
    home_score = _num(game_row.get("Home Score", np.nan), np.nan)
    if not (math.isfinite(away_score) and math.isfinite(home_score)):
        return ""

    bet_type = _safe_text(row.get("Bet Type", "")).strip().lower()
    selection = _safe_text(row.get("Selection", "")).strip()

    if bet_type == "total":
        match = re.search(r"\b(over|under)\s+([+-]?\d+(?:\.\d+)?)", selection, flags=re.IGNORECASE)
        if not match:
            return ""
        direction = match.group(1).lower()
        line = float(match.group(2))
        actual = away_score + home_score
        if abs(actual - line) < 1e-9:
            return "Push"
        if direction == "over":
            return "Win" if actual > line else "Loss"
        return "Win" if actual < line else "Loss"

    if bet_type == "spread":
        match = re.match(r"^(.+?)\s+([+-]\d+(?:\.\d+)?)\s*$", selection)
        if not match:
            return ""
        selected_team = _normalize_team(match.group(1))
        spread = float(match.group(2))
        if selected_team == away_team:
            adjusted_margin = away_score + spread - home_score
        elif selected_team == home_team:
            adjusted_margin = home_score + spread - away_score
        else:
            return ""
        if abs(adjusted_margin) < 1e-9:
            return "Push"
        return "Win" if adjusted_margin > 0 else "Loss"

    if bet_type == "moneyline":
        cleaned = re.sub(r"\s+(?:moneyline|ml)\s*$", "", selection, flags=re.IGNORECASE).strip()
        selected_team = _normalize_team(cleaned)
        if selected_team not in [away_team, home_team]:
            first_token = _normalize_team(selection.split()[0]) if selection.split() else ""
            selected_team = first_token if first_token in [away_team, home_team] else ""
        if not selected_team:
            return ""
        if abs(away_score - home_score) < 1e-9:
            return "Push"
        winner = away_team if away_score > home_score else home_team
        return "Win" if selected_team == winner else "Loss"

    return ""


def _auto_update_game_tracker() -> tuple[int, str]:
    """Refresh final NFL scores and grade any unfinished game wagers."""
    if not sheets_ready():
        return 0, "Google Sheets is not configured."
    tracker = read_sheet(TRACKER_TAB, TRACKER_COLUMNS)
    if tracker is None or tracker.empty:
        return 0, "No game tracker rows yet."
    if "Result" in tracker.columns:
        tracker["Result"] = tracker["Result"].astype(object)

    schedule_cache: dict[int, pd.DataFrame] = {}
    updated_rows = 0

    for index, row in tracker.iterrows():
        current_result = _safe_text(row.get("Result", "")).strip().lower()
        if current_result not in ["", "pending"]:
            continue
        season = _int(row.get("Season", 0), 0)
        week = _int(row.get("Week", 0), 0)
        if season <= 0:
            continue

        if season not in schedule_cache:
            try:
                schedule_cache[season] = _schedule_for_season(season, refresh=True)
            except Exception:
                schedule_cache[season] = pd.DataFrame(columns=SCHEDULE_COLUMNS)
        schedule = schedule_cache[season]
        if schedule is None or schedule.empty:
            continue

        game_id = _safe_text(row.get("Game ID", ""))
        matches = pd.DataFrame()
        if game_id and "Game ID" in schedule.columns:
            matches = schedule[schedule["Game ID"].astype(str) == str(game_id)].copy()

        if matches.empty:
            away_team, home_team = _game_teams_from_label(row.get("Game", ""))
            fallback = schedule.copy()
            if week > 0 and "Week" in fallback.columns:
                fallback = fallback[pd.to_numeric(fallback["Week"], errors="coerce") == week]
            if away_team and home_team:
                fallback = fallback[
                    (fallback["Away Team"].astype(str).map(_normalize_team) == away_team)
                    & (fallback["Home Team"].astype(str).map(_normalize_team) == home_team)
                ]
            matches = fallback

        if matches.empty:
            continue
        game_row = matches.iloc[-1]
        away_score = _num(game_row.get("Away Score", np.nan), np.nan)
        home_score = _num(game_row.get("Home Score", np.nan), np.nan)
        if not (math.isfinite(away_score) and math.isfinite(home_score)):
            continue

        result = _grade_completed_game_bet(row, game_row)
        if result in ["Win", "Loss", "Push"]:
            tracker.at[index, "Result"] = result
            updated_rows += 1

    if updated_rows:
        write_sheet(TRACKER_TAB, tracker, TRACKER_COLUMNS)
    return updated_rows, f"Updated {updated_rows} completed game bet result(s)."


def _render_game_tracker() -> None:
    st.subheader("NFL Bet Tracker")
    try:
        updated, message = _auto_update_game_tracker()
        if updated:
            st.success(message)
    except Exception as exc:
        st.warning(f"Automatic game-result update could not finish: {exc}")
    dataframe = read_sheet(TRACKER_TAB, TRACKER_COLUMNS)
    if dataframe is not None and not dataframe.empty:
        st.dataframe(dataframe.iloc[::-1], use_container_width=True, hide_index=True)
    else:
        st.info("No tracked NFL game bets yet.")


'''

          marker = "def _render_prop_tracker() -> None:\n"
          if "def _auto_update_game_tracker()" not in text:
              if marker not in text:
                  raise SystemExit("Could not find NFL prop tracker insertion point")
              text = text.replace(marker, insert + marker, 1)
              print("Added automatic NFL game tracker grading helpers")
          else:
              print("Automatic NFL game tracker grading helpers already present")

          old = '''    elif page == "Tracker":
        _table(TRACKER_TAB, TRACKER_COLUMNS, "NFL Bet Tracker")'''
          new = '''    elif page == "Tracker":
        _render_game_tracker()'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Could not find NFL Tracker render branch")
              text = text.replace(old, new, 1)
              print("Connected Tracker page to automatic grading")
          else:
              print("Tracker page already uses automatic grading")

          path.write_text(text)
          PY

      - name: Verify patch
        shell: bash
        run: |
          python -m py_compile builders/nfl_builder.py
          grep -q 'def _auto_update_game_tracker()' builders/nfl_builder.py
          grep -q 'def _render_game_tracker()' builders/nfl_builder.py
          grep -q '_render_game_tracker()' builders/nfl_builder.py
          git diff --check

      - name: Commit automatic grading
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Auto-grade completed NFL game bets"
          git push
