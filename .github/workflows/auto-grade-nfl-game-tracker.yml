name: Auto-grade NFL game tracker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-grade-nfl-game-tracker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply automatic game-result grading patch
        run: python scripts/auto_grade_nfl_game_tracker_patch.py

      - name: Verify patch
        shell: bash
        run: |
          python -m py_compile builders/nfl_builder.py
          grep -q 'def _auto_update_game_tracker()' builders/nfl_builder.py
          grep -q 'def _render_game_tracker()' builders/nfl_builder.py
          grep -q '_render_game_tracker()' builders/nfl_builder.py
          git diff --check

      - name: Commit automatic grading
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Auto-grade completed NFL game bets"
          git push
