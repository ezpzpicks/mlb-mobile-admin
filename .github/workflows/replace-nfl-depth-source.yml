name: Replace NFL skill depth source

on:
  push:
    paths:
      - ".github/workflows/replace-nfl-depth-source.yml"

permissions:
  contents: write

jobs:
  replace-depth-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace depth source
        run: python .github/scripts/replace_nfl_depth_source.py

      - name: Validate replacement
        shell: bash
        run: |
          python -m py_compile builders/nfl_builder.py
          grep -q "def _load_espn_depth_charts" builders/nfl_builder.py
          grep -q "ESPN current depth chart" builders/nfl_builder.py
          grep -q '"RB2", \["RB", "HB"\]' builders/nfl_builder.py
          if grep -q 'pd.to_numeric(skill\["depth_chart_order"\]' builders/nfl_builder.py; then
            echo "Legacy Sleeper depth ordering still present"
            exit 1
          fi
          git diff --check

      - name: Commit permanent source replacement
        shell: bash
        run: |
          rm -f .github/workflows/replace-nfl-depth-source.yml
          rm -f .github/scripts/replace_nfl_depth_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py .github/workflows/replace-nfl-depth-source.yml .github/scripts/replace_nfl_depth_source.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use ESPN for current NFL skill depth charts"
          git push
