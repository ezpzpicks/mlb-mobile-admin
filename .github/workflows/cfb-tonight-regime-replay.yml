name: CFB tonight v2.6 correction replay

on:
  push:
    branches: [audit-ncaaf-margin-2026-10-02]
    paths: ['.github/workflows/cfb-tonight-regime-replay.yml']
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: pip install --disable-pip-version-check streamlit pandas numpy requests polars pyarrow lxml html5lib beautifulsoup4
      - name: Replay v2.6 with direct feed name-ID mapping
        env:
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, math
          import numpy as np
          import pandas as pd
          import requests, tempfile, pathlib
          from builders import cfb_builder as cb
          from builders import cfb_game_regression as spread
          from builders import cfb_2026_regime as regime

          season=2026; week=5
          urls={
            'fpi':'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfb_fpi_weekly/cfb_fpi_weekly_2026.parquet',
            'ret':'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfb_returning_production/cfb_returning_production_2026.parquet',
            'sum':'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/cfb_team_summaries_weekly/cfb_team_summaries_weekly_2026.parquet',
          }
          frames={}
          for key,url in urls.items():
              p=pathlib.Path(tempfile.gettempdir())/f'{key}.parquet'
              p.write_bytes(requests.get(url,timeout=60).content)
              frames[key]=pd.read_parquet(p)
              print(key,'COLUMNS',list(frames[key].columns))

          def canon(x): return cb._canonical_team_name(x)
          def namecol(df):
              candidates=[c for c in df.columns if str(c).lower() in {'team','team_name','school','team_display_name','pos_team','pos_team_name'}]
              return candidates[0] if candidates else None
          for k,df in frames.items(): print(k,'NAMECOL',namecol(df))

          # Build a broad canonical name -> id mapping from all three feeds.
          name_to_id={}
          for df in frames.values():
              nc=namecol(df)
              idc=next((c for c in df.columns if str(c).lower() in {'team_id','pos_team_id'}),None)
              if nc and idc:
                  for _,r in df[[nc,idc]].dropna().drop_duplicates().iterrows():
                      try:name_to_id[canon(r[nc])]=float(r[idc])
                      except:pass
          print('NAME_TO_ID_TARGETS',json.dumps({k:name_to_id.get(k) for k in ['Liberty','Delaware','Pittsburgh','Virginia Tech','Penn State','Northwestern']},indent=2))

          games=cb._parse_games(cb._espn_games_payload(season),season)
          targets=[('Liberty','Delaware'),('Pittsburgh','Virginia Tech'),('Penn State','Northwestern')]
          ctx=regime._context(cb,season,week)
          rows=[]
          for away,home in targets:
              m=games[(games['Away Team'].astype(str)==away)&(games['Home Team'].astype(str)==home)]
              if m.empty: continue
              g=m.iloc[0]
              away_base,home_base,af,hf=spread._regression_base(cb,g)
              aid=name_to_id.get(away); hid=name_to_id.get(home)
              features={
                  'gamecontrol_diff': float(ctx['gamecontrol'][hid]-ctx['gamecontrol'][aid]),
                  'def_returning_diff': float(ctx['def_returning'][hid]-ctx['def_returning'][aid]),
                  'explosive_diff': float(ctx['explosive'][home]-ctx['explosive'][away]),
                  'current_power_margin': float(hf.get('current_power_delta')-af.get('current_power_delta')),
                  'havoc_off_diff': float(ctx['havoc_off'][hid]-ctx['havoc_off'][aid]),
              }
              corr,contrib=regime._predict_correction(features)
              rows.append({'away':away,'home':home,'game_time':str(g.get('Game Time','')),'core_margin':float(home_base-away_base),'features':features,'correction':corr,'contributions':contrib,'home_shift':corr/2,'away_shift':-corr/2})
          print('TONIGHT_REPLAY_JSON_START')
          print(json.dumps(rows,indent=2,allow_nan=False))
          print('TONIGHT_REPLAY_JSON_END')
          PY
