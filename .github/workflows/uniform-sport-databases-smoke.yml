name: Uniform sport databases smoke

on:
  push:
    branches:
      - main
      - auto-init-football-workbooks
      - football-shared-container-fallback
    paths:
      - shared/storage.py
      - shared/public_contract.py
      - builders/nfl_builder.py
      - builders/cfb_builder.py
      - app_mobile_admin.py
      - sitecustomize.py
      - research/apply_uniform_sport_databases.py
      - research/test_uniform_sport_databases.py
      - .github/workflows/uniform-sport-databases-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - shared/storage.py
      - shared/public_contract.py
      - builders/nfl_builder.py
      - builders/cfb_builder.py
      - app_mobile_admin.py
      - sitecustomize.py
      - research/apply_uniform_sport_databases.py
      - research/test_uniform_sport_databases.py
      - .github/workflows/uniform-sport-databases-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile storage and builders
        run: |
          python -m py_compile shared/storage.py shared/public_contract.py builders/nfl_builder.py builders/cfb_builder.py app_mobile_admin.py sitecustomize.py research/test_uniform_sport_databases.py
      - name: Run database contract smoke test
        run: python -m research.test_uniform_sport_databases
      - name: Re-run CFB v2 regression smoke
        run: python -m research.test_cfb_game_regression_layer
      - name: Re-run NFL regression smoke
        run: python -m research.test_nfl_skill_prop_regression
      - name: Check diff
        run: git diff --check
