name: NFL variable tier validation

on:
  push:
    branches:
      - nfl-variable-tier-v1
    paths:
      - builders/nfl_slot_matchups.py
      - builders/nfl_builder.py
      - builders/nfl_skill_prop_regression.py
      - .github/workflows/nfl-rb-wr-regression.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-variable-tier-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile NFL builder modules
        run: python -m py_compile builders/nfl_builder.py builders/nfl_skill_prop_regression.py builders/nfl_slot_matchups.py
      - name: Verify variable-tier constants
        run: |
          grep -q "nfl-v4.18-variable-tier-yardage-weighting" builders/nfl_slot_matchups.py
          grep -q "YARDAGE_VARIABLE_SPECS" builders/nfl_slot_matchups.py
          grep -q "_variable_scaled_matchup_factor" builders/nfl_slot_matchups.py
