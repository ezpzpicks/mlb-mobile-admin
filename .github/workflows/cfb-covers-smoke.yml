name: CFB Covers integration smoke

on:
  push:
    paths:
      - "builders/cfb_covers.py"
      - "research/test_cfb_covers_layer.py"
      - "app_mobile_admin.py"
      - ".github/workflows/cfb-covers-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4
      - name: Compile integration files
        run: python -m py_compile builders/cfb_covers.py app_mobile_admin.py
      - name: Run Covers parser and matching smoke test
        run: python research/test_cfb_covers_layer.py
