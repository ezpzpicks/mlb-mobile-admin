name: CFB Covers integration smoke

on:
  push:
    paths:
      - "builders/cfb_covers.py"
      - "builders/cfb_interactive_recovery.py"
      - "builders/cfb_save_type_guard.py"
      - "research/test_cfb_covers_layer.py"
      - "research/test_cfb_covers_directory_recovery.py"
      - "research/test_cfb_fast_save.py"
      - "research/test_cfb_save_type_guard.py"
      - "app_mobile_admin.py"
      - ".github/workflows/cfb-covers-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4
      - name: Compile integration files
        run: python -m py_compile builders/cfb_covers.py builders/cfb_interactive_recovery.py builders/cfb_save_type_guard.py app_mobile_admin.py research/test_cfb_fast_save.py research/test_cfb_save_type_guard.py
      - name: Run Covers parser and matching smoke test
        run: PYTHONPATH=. python research/test_cfb_covers_layer.py
      - name: Run Covers team directory recovery test
        run: PYTHONPATH=. python research/test_cfb_covers_directory_recovery.py
      - name: Run direct CFB save smoke test
        run: PYTHONPATH=. python research/test_cfb_fast_save.py
      - name: Run CFB save type guard smoke test
        run: PYTHONPATH=. python research/test_cfb_save_type_guard.py
