name: Apply NFL build autocalibration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ezpz-nfl-build-autocalibration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate source edit
        shell: bash
        run: |
          python scripts/apply_nfl_build_autocalibration.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("builders/nfl_builder.py").read_text())
          PY
          git diff --check
      - name: Commit permanent production code
        shell: bash
        run: |
          rm scripts/apply_nfl_build_autocalibration.py
          rm .github/workflows/ezpz-nfl-build-autocalibration.yml
          git config user.name "EZPZ Picks Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "NFL: refresh completed projections before builds"
          git push origin HEAD:main
