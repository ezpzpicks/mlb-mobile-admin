name: CFB team-score regression research

on:
  workflow_dispatch:
  push:
    branches:
      - cfb-regression-v2-research
    paths:
      - research/cfb_team_score_regression.py
      - .github/workflows/cfb-team-score-regression.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfb-regression-v2-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install statsmodels pyarrow
      - name: Compile research
        run: python -m py_compile research/cfb_team_score_regression.py builders/cfb_builder.py
      - name: Run leakage-safe CFB regression
        env:
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          EZPZ_CFB_CACHE_SECONDS: '86400'
        run: python -m research.cfb_team_score_regression
      - name: Record regression results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/results/cfb_team_score_regression_results.json research/results/cfb_team_score_regression_summary.md
          if ! git diff --cached --quiet; then
            git commit -m "Record CFB team score regression results"
            git pull --rebase origin cfb-regression-v2-research
            git push origin HEAD:cfb-regression-v2-research
          fi
