name: Replace NFL ESPN injury depth logic

on:
  push:
    paths:
      - ".github/workflows/replace-nfl-espn-injury-depth.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct migration boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/replace_nfl_espn_injury_depth_logic.py')
          s = p.read_text(encoding='utf-8')
          old = 'end = text.find("\\ndef _finalize_lineup(\\n", start)'
          new = 'end = text.find("\\ndef _finalize_lineup(", start)'
          if old not in s:
              raise SystemExit('auto-lineup boundary anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Replace NFL injury and depth logic
        run: python .github/scripts/replace_nfl_espn_injury_depth_logic.py

      - name: Validate NFL builder
        shell: bash
        run: |
          python -m py_compile builders/nfl_builder.py
          grep -q "def _load_espn_injuries" builders/nfl_builder.py
          grep -q '"Depth Downgrade"' builders/nfl_builder.py
          grep -q "ESPN current injury report" builders/nfl_builder.py
          grep -q "skipped_unavailable" builders/nfl_builder.py
          grep -q "_load_espn_depth_charts, _load_espn_injuries" builders/nfl_builder.py
          git diff --check

      - name: Commit permanent builder replacement
        shell: bash
        run: |
          rm -f .github/workflows/replace-nfl-espn-injury-depth.yml
          rm -f .github/scripts/replace_nfl_espn_injury_depth_logic.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py .github/workflows/replace-nfl-espn-injury-depth.yml .github/scripts/replace_nfl_espn_injury_depth_logic.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use ESPN injury status for NFL depth adjustments"
          git push
