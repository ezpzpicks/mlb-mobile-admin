name: CFB HFA rolling edge validation

on:
  push:
    branches:
      - audit-ncaaf-margin-2026-10-02
    paths:
      - 'research/cfb_hfa_rolling_edge_validation.py'
      - 'research/cfb_historical_markets.py'
      - '.github/workflows/cfb-hfa-rolling-edge-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy
      - name: Run rolling HFA validation
        env:
          PYTHONUNBUFFERED: '1'
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: '.'
        run: python research/cfb_hfa_rolling_edge_validation.py
      - name: Commit results
        run: |
          git add research/results/cfb_hfa_rolling_edge_validation.json research/results/CFB_HFA_ROLLING_EDGE_VALIDATION.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: persist rolling HFA edge validation'
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
