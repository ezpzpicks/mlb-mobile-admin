name: Fix NFL current season default

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-nfl-current-season-default.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('builders/nfl_builder.py')
          s = p.read_text()
          start = s.index('def _current_nfl_season() -> int:')
          end = s.index('\n\ndef _schedule_date_series', start)
          replacement = (
              'def _current_nfl_season() -> int:\n'
              '    # Prefer the calendar-defined current NFL season when the data library lags.\n'
              '    today = date.today()\n'
              '    calendar_season = today.year - 1 if today.month <= 2 else today.year\n'
              '    try:\n'
              '        if nfl is not None and hasattr(nfl, "get_current_season"):\n'
              '            return max(calendar_season, int(nfl.get_current_season()))\n'
              '    except Exception:\n'
              '        pass\n'
              '    return calendar_season\n'
          )
          p.write_text(s[:start] + replacement + s[end:])
          PY
          python -m py_compile builders/nfl_builder.py
      - name: Commit builder change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py
          if ! git diff --cached --quiet; then
            git commit -m "Default NFL builder to current season"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
