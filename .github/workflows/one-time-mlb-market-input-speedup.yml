name: One-time MLB market input speedup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-mlb-market-input-speedup.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Optimize MLB market inputs
        run: python scripts/one_time_optimize_mlb_market_inputs.py

      - name: Validate MLB builder
        run: |
          python -m py_compile builders/mlb_builder.py
          git diff --check

      - name: Commit optimized builder
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/mlb_builder.py
          git commit -m "Speed up MLB market input entry"
          git push origin main
