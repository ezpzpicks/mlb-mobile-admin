name: Finalize ESPN-only NFL depth source

on:
  push:
    branches: [main]
    paths: [".github/workflows/finalize-espn-only-nfl-depth.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Apply corrected permanent replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path("builders/nfl_builder.py")
          text = builder.read_text(encoding="utf-8")
          text = text.replace(
              "                _load_depth_charts_season, _load_injuries_season, _load_sleeper_players,\n",
              "                _load_depth_charts_season, _load_injuries_season,\n",
          )
          text = text.replace(
              "            try:\n                _load_sleeper_players.clear()\n            except Exception:\n                pass\n",
              "",
          )
          builder.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/apply-espn-only-nfl-depth.yml").read_text(encoding="utf-8")
          start_marker = "      - name: Replace current NFL depth and injury authority\n        shell: bash\n        run: |\n          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate builder and live ESPN source"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit("Replacement script start not found")
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit("Replacement script end not found")
          script = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())

          # The embedded source snippets are already correctly indented after
          # GitHub Actions removes the run-block margin. Remove the old second
          # dedent statements, which only damaged nested Python indentation.
          cleaned = []
          for line in script.splitlines():
              if (
                  line.startswith(("new_espn_block =", "new_latest =", "new_injury =", "new_slot ="))
                  and '"\\n".join(line[' in line
                  and ".splitlines())" in line
              ):
                  continue
              cleaned.append(line)
          script = "\n".join(cleaned)
          exec(compile(script, "espn_only_depth_migration", "exec"), {"__name__": "__main__"})
          PY

      - name: Compile and verify source contract
        shell: bash
        run: |
          python -m py_compile builders/nfl_builder.py
          grep -q 'nfl-v3.5-espn-only-depth-injury-2026-09-13' builders/nfl_builder.py
          grep -q 'no backup depth source is enabled' builders/nfl_builder.py
          grep -q 'ESPN Core depth-chart athlete status' builders/nfl_builder.py
          ! grep -q '_load_sleeper_players' builders/nfl_builder.py
          ! grep -q '_load_espn_athlete_name_index' builders/nfl_builder.py
          ! grep -q 'site.api.espn.com/apis/site/v2/sports/football/nfl/injuries' builders/nfl_builder.py
          git diff --check

      - name: Validate live ESPN depth and injury truth
        shell: bash
        run: |
          python - <<'PY'
          import requests
          s = requests.Session()
          s.headers.update({"User-Agent": "EZPZ-Picks/1.0"})
          expected = {
              "ATL": ("1", ["Bijan Robinson", "Brian Robinson Jr.", "Trey Sermon"]),
              "PIT": ("23", ["Jaylen Warren", "Rico Dowdle", "Eli Heidenreich"]),
          }
          resolved = {}
          for team, (team_id, wanted) in expected.items():
              url = f"https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/teams/{team_id}/depthcharts"
              r = s.get(url, timeout=30)
              r.raise_for_status()
              payload = r.json()
              best = None
              best_score = -1
              for chart in payload.get("items", []):
                  positions = chart.get("positions", {}) if isinstance(chart, dict) else {}
                  keys = set(positions) if isinstance(positions, dict) else set()
                  score = sum(p in keys for p in ["qb", "rb", "wr", "te"])
                  if score > best_score:
                      best_score = score
                      best = positions
              entries = (best or {}).get("rb", {}).get("athletes", [])
              got = []
              for entry in sorted(entries, key=lambda x: int(x.get("rank", 99))):
                  ref = str((entry.get("athlete") or {}).get("$ref") or "").replace("http://", "https://")
                  ar = s.get(ref, timeout=20)
                  ar.raise_for_status()
                  athlete = ar.json()
                  name = athlete.get("displayName") or athlete.get("fullName") or ""
                  got.append(name)
                  resolved[name] = athlete
              assert got[:3] == wanted, f"{team}: {got[:3]} != {wanted}"
              print(team, got[:3])

          for name in ["Jaylen Warren", "Rico Dowdle", "Bijan Robinson", "Brian Robinson Jr."]:
              assert not resolved[name].get("injuries"), f"{name} has unexpected ESPN injury: {resolved[name].get('injuries')}"

          for pid in ["4241479", "4360423"]:
              url = f"https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/athletes/{pid}?lang=en&region=us"
              athlete = s.get(url, timeout=20).json()
              injuries = athlete.get("injuries", [])
              assert injuries
              assert ((injuries[0].get("type") or {}).get("abbreviation") or "").upper() == "O"
          print("Live ESPN-only depth/injury checks passed")
          PY

      - name: Remove temporary migration files
        run: |
          rm -f .github/workflows/apply-espn-only-nfl-depth.yml
          rm -f .github/workflows/retry-espn-only-nfl-depth.yml
          rm -f .github/workflows/diag-nfl-sleeper-ref.yml
          rm -f .github/workflows/diag-espn-transform-indent.yml
          rm -f .github/workflows/finalize-espn-only-nfl-depth.yml

      - name: Commit permanent source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/nfl_builder.py .github/workflows
          git commit -m "Make ESPN sole NFL depth and injury authority"
          git push
