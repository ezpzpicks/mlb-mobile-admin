name: One-time handpicked latency fix

on:
  push:
    paths:
      - ".github/workflows/fix-handpicked-latency.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MLB handpicked writes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("builders/mlb_builder.py")
          text = path.read_text(encoding="utf-8")

          save_tracker_needle = '''def save_tracker(df):
              return write_sheet(TRACKER_TAB, df, TRACKER_COLUMNS)
          '''
          if save_tracker_needle not in text:
              raise SystemExit("save_tracker insertion point not found")

          helper = '''def save_tracker(df):
              return write_sheet(TRACKER_TAB, df, TRACKER_COLUMNS)


          _HANDPICK_TRACKER_COLUMNS = [
              "Favorite Pick",
              "Handpicked Record",
              "Favorite Rank",
              "Favorite Tag",
              "Favorite Notes",
          ]


          def save_handpick_tracker_row(tracker_df, row_idx, append_new=False):
              """Persist only the handpicked change instead of rewriting all of bet_tracker."""
              try:
                  worksheet = get_or_create_worksheet(TRACKER_TAB, TRACKER_COLUMNS)

                  if row_idx not in tracker_df.index:
                      return False

                  if append_new:
                      values = []
                      for col in TRACKER_COLUMNS:
                          value = tracker_df.loc[row_idx, col] if col in tracker_df.columns else ""
                          try:
                              if pd.isna(value):
                                  value = ""
                          except Exception:
                              pass
                          values.append(str(value))
                      worksheet.append_row(values, value_input_option="RAW")
                      return True

                  position = tracker_df.index.get_loc(row_idx)
                  if not isinstance(position, (int,)):
                      try:
                          position = int(position)
                      except Exception:
                          return False
                  sheet_row = int(position) + 2

                  first_col = TRACKER_COLUMNS.index(_HANDPICK_TRACKER_COLUMNS[0]) + 1
                  last_col = TRACKER_COLUMNS.index(_HANDPICK_TRACKER_COLUMNS[-1]) + 1
                  start_cell = gspread.utils.rowcol_to_a1(sheet_row, first_col)
                  end_cell = gspread.utils.rowcol_to_a1(sheet_row, last_col)

                  values = []
                  for col in _HANDPICK_TRACKER_COLUMNS:
                      value = tracker_df.loc[row_idx, col] if col in tracker_df.columns else ""
                      try:
                          if pd.isna(value):
                              value = ""
                      except Exception:
                          pass
                      values.append(str(value))

                  worksheet.update(
                      values=[values],
                      range_name=f"{start_cell}:{end_cell}",
                      value_input_option="RAW",
                  )
                  return True
              except Exception as e:
                  st.error(f"Could not save the handpicked update to Google Sheets: {e}")
                  return False
          '''
          text = text.replace(save_tracker_needle, helper, 1)

          def replace_function(source, function_name, next_function_name, replacement):
              start = source.find(f"def {function_name}(")
              if start < 0:
                  raise SystemExit(f"{function_name} not found")
              end = source.find(f"\ndef {next_function_name}(", start)
              if end < 0:
                  raise SystemExit(f"end marker for {function_name} not found")
              return source[:start] + replacement.rstrip() + "\n\n" + source[end + 1:]

          new_best = '''def mark_best_play_as_handpicked(play, favorite_rank="", favorite_tag="", favorite_notes="", tracker_df=None):
              """Mark any best-play or full-slate candidate as handpicked for the public website."""
              if tracker_df is None:
                  tracker_df = load_tracker()
              if tracker_df is None or tracker_df.empty:
                  tracker_df = pd.DataFrame(columns=TRACKER_COLUMNS)

              for col in _HANDPICK_TRACKER_COLUMNS:
                  if col not in tracker_df.columns:
                      tracker_df[col] = ""

              matches = []
              for idx, row in tracker_df.iterrows():
                  if tracker_row_matches_best_play(row, play):
                      matches.append(idx)

              if not matches:
                  # Full-slate candidates may not have qualified for automatic Bet Tracker
                  # insertion. Append one row instead of clearing/rewriting the entire sheet.
                  new_row = _tracker_row_from_handpick_play(
                      play,
                      favorite_rank=favorite_rank,
                      favorite_tag=favorite_tag,
                      favorite_notes=favorite_notes,
                  )
                  new_index = len(tracker_df)
                  while new_index in tracker_df.index:
                      new_index += 1
                  for col in TRACKER_COLUMNS:
                      tracker_df.loc[new_index, col] = new_row.get(col, "")
                  if save_handpick_tracker_row(tracker_df, new_index, append_new=True):
                      return True, "Created the tracker row and added it to EZPZ Handpicked Plays."
                  return False, "Could not create/save the handpicked tracker row."

              # Prefer a pending row, but allow completed rows if you are handpicking after results are entered.
              pending_matches = [idx for idx in matches if str(tracker_df.loc[idx, "Result"]).strip().upper() == "PENDING"]
              target_idx = pending_matches[0] if pending_matches else matches[0]

              tracker_df.loc[target_idx, "Favorite Pick"] = "TRUE"
              tracker_df.loc[target_idx, "Handpicked Record"] = "TRUE"
              tracker_df.loc[target_idx, "Favorite Rank"] = str(favorite_rank).strip()
              tracker_df.loc[target_idx, "Favorite Tag"] = str(favorite_tag).strip().upper()
              tracker_df.loc[target_idx, "Favorite Notes"] = str(favorite_notes).strip()

              if save_handpick_tracker_row(tracker_df, target_idx):
                  return True, "Added to EZPZ Handpicked Plays."
              return False, "Could not save the handpicked update to Google Sheets."
          '''

          new_saved = '''def mark_tracker_row_as_handpicked(row_idx, favorite_rank="", favorite_tag="", favorite_notes="", tracker_df=None):
              """Mark any saved bet_tracker row as handpicked, even if it is not a Best Play."""
              if tracker_df is None:
                  tracker_df = load_tracker()
              if tracker_df.empty or row_idx not in tracker_df.index:
                  return False, "Could not find that saved bet in bet_tracker."

              for col in _HANDPICK_TRACKER_COLUMNS:
                  if col not in tracker_df.columns:
                      tracker_df[col] = ""

              tracker_df.loc[row_idx, "Favorite Pick"] = "TRUE"
              tracker_df.loc[row_idx, "Handpicked Record"] = "TRUE"
              tracker_df.loc[row_idx, "Favorite Rank"] = str(favorite_rank).strip()
              tracker_df.loc[row_idx, "Favorite Tag"] = str(favorite_tag).strip().upper()
              tracker_df.loc[row_idx, "Favorite Notes"] = str(favorite_notes).strip()

              if save_handpick_tracker_row(tracker_df, row_idx):
                  return True, "Added saved bet to EZPZ Handpicked Plays."
              return False, "Could not save the handpicked update to Google Sheets."
          '''

          new_unmark = '''def unmark_tracker_row_as_handpicked(row_idx, tracker_df=None):
              """Remove today's handpicked badge without rewriting the entire tracker sheet."""
              if tracker_df is None:
                  tracker_df = load_tracker()
              if tracker_df.empty or row_idx not in tracker_df.index:
                  return False, "Could not find that saved bet in bet_tracker."
              for col in _HANDPICK_TRACKER_COLUMNS:
                  if col not in tracker_df.columns:
                      tracker_df[col] = ""
              tracker_df.loc[row_idx, "Favorite Pick"] = ""
              tracker_df.loc[row_idx, "Favorite Rank"] = ""
              tracker_df.loc[row_idx, "Favorite Tag"] = ""
              tracker_df.loc[row_idx, "Favorite Notes"] = ""
              if save_handpick_tracker_row(tracker_df, row_idx):
                  return True, "Removed today's handpicked badge from this saved bet."
              return False, "Could not save the update to Google Sheets."
          '''

          text = replace_function(text, "mark_best_play_as_handpicked", "mark_tracker_row_as_handpicked", new_best)
          text = replace_function(text, "mark_tracker_row_as_handpicked", "unmark_tracker_row_as_handpicked", new_saved)
          text = replace_function(text, "unmark_tracker_row_as_handpicked", "display_record_summary", new_unmark)

          best_ui_old = '''ok, message = mark_best_play_as_handpicked(play)
                              if ok:
                                  st.success(message)
                                  st.rerun()
                              else:
                                  st.error(message)'''
          best_ui_new = '''ok, message = mark_best_play_as_handpicked(play, tracker_df=tracker_df)
                              if ok:
                                  st.success(message)
                              else:
                                  st.error(message)'''
          best_count = text.count(best_ui_old)
          if best_count != 2:
              raise SystemExit(f"expected 2 best-play handpick UI blocks, found {best_count}")
          text = text.replace(best_ui_old, best_ui_new)

          unmark_ui_old = '''ok, message = unmark_tracker_row_as_handpicked(idx)
                          if ok:
                              st.success(message)
                              st.rerun()
                          else:
                              st.error(message)'''
          unmark_ui_new = '''ok, message = unmark_tracker_row_as_handpicked(idx, tracker_df=tracker_df)
                          if ok:
                              st.success(message)
                          else:
                              st.error(message)'''
          if text.count(unmark_ui_old) != 1:
              raise SystemExit("unmark handpick UI block not found exactly once")
          text = text.replace(unmark_ui_old, unmark_ui_new, 1)

          saved_ui_old = '''ok, message = mark_tracker_row_as_handpicked(idx)
                          if ok:
                              st.success(message)
                              st.rerun()
                          else:
                              st.error(message)'''
          saved_ui_new = '''ok, message = mark_tracker_row_as_handpicked(idx, tracker_df=tracker_df)
                          if ok:
                              st.success(message)
                          else:
                              st.error(message)'''
          if text.count(saved_ui_old) != 1:
              raise SystemExit("saved-row handpick UI block not found exactly once")
          text = text.replace(saved_ui_old, saved_ui_new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Syntax check
        run: python -m py_compile builders/mlb_builder.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/mlb_builder.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Speed up MLB handpicked builder updates"
          git push
