name: CFB 2026 regime smoke

on:
  push:
    branches: [main]
    paths:
      - 'builders/cfb_2026_regime.py'
      - 'app_mobile_admin.py'
      - 'research/test_cfb_2026_regime_layer.py'
      - '.github/workflows/cfb-2026-regime-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Compile regime layer and app
        run: python -m py_compile builders/cfb_2026_regime.py app_mobile_admin.py research/test_cfb_2026_regime_layer.py
      - name: Run regime layer smoke test
        run: PYTHONPATH=. python research/test_cfb_2026_regime_layer.py
