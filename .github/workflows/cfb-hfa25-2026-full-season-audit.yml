name: CFB HFA25 2026 full-season ATS audit

on:
  push:
    branches:
      - audit-ncaaf-margin-2026-10-02
    paths:
      - 'research/cfb_hfa25_2026_full_season_audit.py'
      - '.github/workflows/cfb-hfa25-2026-full-season-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy
      - name: Run 2026 full-season ATS audit
        env:
          PYTHONUNBUFFERED: '1'
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: .
        run: python research/cfb_hfa25_2026_full_season_audit.py
      - name: Commit results
        run: |
          git add research/results/cfb_hfa25_2026_full_season_audit.json research/results/CFB_HFA25_2026_FULL_SEASON_AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: persist 2026 full-season HFA25 ATS audit'
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
