name: Fix NFL TE1 prop market surface

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-nfl-te1-market-surface.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix NFL TE1 prop market surface'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Permanently expose TE1 receiving yards and Anytime TD inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD_VERSION = "nfl-v4.9-te1-yardage-matchups-2026-09-13"
          NEW_VERSION = "nfl-v4.10-te1-prop-surface-2026-09-13"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          builder_path = Path("builders/nfl_builder.py")
          text = builder_path.read_text(encoding="utf-8")
          text = replace_once(text, f'MODEL_VERSION = "{OLD_VERSION}"', f'MODEL_VERSION = "{NEW_VERSION}"', "builder version")
          old_mask = '''        wager_mask = (
            ((prop_base["Position"].astype(str) == "QB") & (prop_base["Market"].astype(str) == "Passing Yards"))
            | ((prop_base["Position"].astype(str) == "RB") & (prop_base["Market"].astype(str).isin(["Rushing Yards", "Receiving Yards"])))
            | ((prop_base["Position"].astype(str) == "WR") & (prop_base["Market"].astype(str) == "Receiving Yards"))
        )
'''
          new_mask = '''        wager_mask = (
            ((prop_base["Position"].astype(str) == "QB") & (prop_base["Market"].astype(str) == "Passing Yards"))
            | ((prop_base["Position"].astype(str) == "RB") & (prop_base["Market"].astype(str).isin(["Rushing Yards", "Receiving Yards"])))
            | ((prop_base["Position"].astype(str) == "WR") & (prop_base["Market"].astype(str) == "Receiving Yards"))
            | ((prop_base["Position"].astype(str) == "TE") & (prop_base["Slot"].astype(str) == "TE1") & (prop_base["Market"].astype(str) == "Receiving Yards"))
        )
'''
          text = replace_once(text, old_mask, new_mask, "production wager mask")
          builder_path.write_text(text, encoding="utf-8")

          # Keep the historical source-generation script aligned so it cannot
          # reintroduce the omission if the manual-market migration is replayed.
          patch_path = Path("scripts/patch_nfl_manual_markets.py")
          patch_text = patch_path.read_text(encoding="utf-8")
          if old_mask not in patch_text:
              raise SystemExit("manual-market source template wager mask not found")
          patch_text = patch_text.replace(old_mask, new_mask, 1)
          patch_path.write_text(patch_text, encoding="utf-8")

          slot_path = Path("builders/nfl_slot_matchups.py")
          slot_text = slot_path.read_text(encoding="utf-8")
          slot_text = replace_once(slot_text, f'MODEL_VERSION = "{OLD_VERSION}"', f'MODEL_VERSION = "{NEW_VERSION}"', "slot layer version")
          slot_path.write_text(slot_text, encoding="utf-8")

          app_path = Path("app_mobile_admin.py")
          app_text = app_path.read_text(encoding="utf-8")
          app_text = replace_once(app_text, f'"NFL": "{OLD_VERSION}"', f'"NFL": "{NEW_VERSION}"', "admin version")
          app_path.write_text(app_text, encoding="utf-8")

          # Permanent regression guard: the TE1 market must remain present in
          # the manual yardage surface, and TD rows must be sourced from those
          # same visible yardage players.
          test_path = Path("research/test_nfl_te1_market_surface.py")
          test_path.write_text('''from pathlib import Path\n\n\ndef main() -> None:\n    source = Path("builders/nfl_builder.py").read_text(encoding="utf-8")\n    assert '(prop_base["Position"].astype(str) == "TE")' in source\n    assert '(prop_base["Slot"].astype(str) == "TE1")' in source\n    assert '(prop_base["Market"].astype(str) == "Receiving Yards")' in source\n    assert 'yard_player_keys = {' in source\n    assert '(prop_inputs["Market"].astype(str) == "Anytime TD")' in source\n    assert 'in yard_player_keys' in source\n    assert '"TE1": 6' in source\n    print("NFL TE1 receiving-yard + Anytime TD surface validation passed")\n\n\nif __name__ == "__main__":\n    main()\n''', encoding="utf-8")
          PY

      - name: Validate NFL TE1 production path
        shell: bash
        run: |
          python -m pip install --quiet numpy pandas
          python -m py_compile builders/nfl_builder.py builders/nfl_slot_matchups.py app_mobile_admin.py scripts/patch_nfl_manual_markets.py research/test_nfl_te1_market_surface.py research/test_nfl_slot_matchups.py
          PYTHONPATH=. python research/test_nfl_te1_market_surface.py
          PYTHONPATH=. python research/test_nfl_slot_matchups.py

      - name: Commit permanent source fix
        shell: bash
        run: |
          git config user.name "EZPZ NFL Model Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-nfl-te1-market-surface.yml
          git add builders/nfl_builder.py builders/nfl_slot_matchups.py app_mobile_admin.py scripts/patch_nfl_manual_markets.py research/test_nfl_te1_market_surface.py
          git commit -m "Expose TE1 receiving and touchdown props"
          git push origin HEAD:main
