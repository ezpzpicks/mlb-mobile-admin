name: NFL game regression research

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-game-regression-v4
    paths:
      - research/nfl_game_regression.py
      - research/nfl_game_regression_v2.py
      - .github/workflows/nfl-game-regression.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-game-regression-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyarrow scipy statsmodels
      - name: Run stabilized historical NFL game regression
        run: |
          python -m research.nfl_game_regression_v2 --output-dir artifacts/nfl_game_regression_v2
      - name: Save auditable regression results to branch
        run: |
          mkdir -p research/results
          cp artifacts/nfl_game_regression_v2/nfl_game_regression_results_v2.json research/results/nfl_game_regression_results_v2.json
          cp artifacts/nfl_game_regression_v2/nfl_game_regression_generated_v2.py research/results/nfl_game_regression_generated_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/results/nfl_game_regression_results_v2.json research/results/nfl_game_regression_generated_v2.py
          if ! git diff --cached --quiet; then
            git commit -m "Record stabilized NFL regression results"
            git push origin HEAD:nfl-game-regression-v4
          fi
      - name: Upload full regression outputs
        uses: actions/upload-artifact@v4
        with:
          name: nfl-game-regression-results-v2
          path: artifacts/nfl_game_regression_v2/
          if-no-files-found: error
          retention-days: 14
