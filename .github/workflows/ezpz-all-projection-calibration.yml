name: Apply all-projection NFL calibration edit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ezpz-all-projection-calibration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate production edit
        shell: bash
        run: |
          python scripts/apply_all_projection_calibration_edit.py
          python -m py_compile builders/nfl_builder.py
          git diff --check
      - name: Commit permanent production code
        shell: bash
        run: |
          rm scripts/apply_all_projection_calibration_edit.py
          rm .github/workflows/ezpz-all-projection-calibration.yml
          git config user.name "EZPZ Picks Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "NFL: calibrate every saved prop projection"
          git push origin HEAD:main
