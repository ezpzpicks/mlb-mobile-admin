name: Diagnose NFL Sleeper references
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag-nfl-sleeper-ref.yml"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find references
        run: grep -n -C 3 '_load_sleeper_players' builders/nfl_builder.py || true
