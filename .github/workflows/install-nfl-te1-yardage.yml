name: Install NFL TE1 yardage tracking

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-nfl-te1-yardage.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install NFL TE1 yardage tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Promote primary tight end slot to TE1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, found {count}")
              return text.replace(old, new)

          # Production builder: the only modeled TE depth slot is now TE1.
          path = Path('builders/nfl_builder.py')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(text, 'MODEL_VERSION = "nfl-v4.5-anytime-td-2026-09-13"', 'MODEL_VERSION = "nfl-v4.8-te1-yardage-2026-09-13"', 'builder version')
          text = replace_exact(text, '    ("TE", ["TE"]),', '    ("TE1", ["TE"]),', 'offense TE slot')
          text = replace_exact(text, '    "TE": 0.65,', '    "TE1": 0.65,', 'TE base impact')
          text = replace_exact(text, '            elif slot == "TE" and player_value > 0:', '            elif slot == "TE1" and player_value > 0:', 'TE player value slot')
          text = replace_exact(text, 'slot_order = {"QB": 0, "RB1": 1, "RB2": 2, "WR1": 3, "WR2": 4, "WR3": 5, "TE": 6}', 'slot_order = {"QB": 0, "RB1": 1, "RB2": 2, "WR1": 3, "WR2": 4, "WR3": 5, "TE1": 6}', 'TE display ordering', expected=2)
          text = replace_exact(text, '    top_slot = slot in ["QB", "RB1", "WR1", "TE"]', '    top_slot = slot in ["QB", "RB1", "WR1", "TE1"]', 'TE top role')
          text = replace_exact(text, '.isin(["QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE"])', '.isin(["QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE1"])', 'TE skill filters', expected=2)
          text = replace_exact(text, '    "WR2": 0.29, "WR3": 0.18, "TE": 0.30,', '    "WR2": 0.29, "WR3": 0.18, "TE1": 0.30,', 'TD slot prior')
          text = replace_exact(text, '"WR3": 0.90, "TE": 1.08}', '"WR3": 0.90, "TE1": 1.08}', 'TD receiving slot factor')
          path.write_text(text, encoding='utf-8')

          # Slot matchup / TD learning: canonicalize historical TE rows into TE1
          # while all new snapshots are written as TE1.
          path = Path('builders/nfl_slot_matchups.py')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(text, 'MODEL_VERSION = "nfl-v4.7-touchdown-slot-matchups-2026-09-13"', 'MODEL_VERSION = "nfl-v4.8-te1-yardage-2026-09-13"', 'slot layer version')
          text = replace_exact(text, 'TRACKED_SLOTS = {"QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE"}', 'TRACKED_SLOTS = {"QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE1"}', 'tracked slots')
          text = replace_exact(text, '    "TE": ("TE",),', '    "TE1": ("TE1",),', 'TE family')
          text = replace_exact(text, '{"RB1", "RB2", "WR1", "WR2", "WR3", "TE"}', '{"RB1", "RB2", "WR1", "WR2", "WR3", "TE1"}', 'TE receiving market slots', expected=3)
          text = replace_exact(text, '{"QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE"}', '{"QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE1"}', 'TE TD market slots')
          text = replace_exact(
              text,
              'def _slot(value: Any) -> str:\n    return str(value or "").strip().upper()\n',
              'def _slot(value: Any) -> str:\n    raw = str(value or "").strip().upper()\n    return "TE1" if raw == "TE" else raw\n',
              'TE slot canonicalization',
          )
          text = replace_exact(text, '    lineup["_slot"] = lineup.get("Slot", "").astype(str).str.upper().str.strip()', '    lineup["_slot"] = lineup.get("Slot", "").map(_slot)', 'lineup slot canonicalization')
          path.write_text(text, encoding='utf-8')

          # Keep validation fixtures aligned with the permanent TE1 slot name.
          path = Path('research/test_nfl_slot_matchups.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"TE"', '"TE1"')
          anchor = 'def main() -> None:\n    history = build_history()\n'
          replacement = 'def main() -> None:\n    assert slot_model._slot("TE") == "TE1"\n    assert slot_model._slot("TE1") == "TE1"\n    assert "TE1" in slot_model.TRACKED_SLOTS and "TE" not in slot_model.TRACKED_SLOTS\n    history = build_history()\n'
          if anchor not in text:
              raise SystemExit('TE1 validation anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')

          # Builder header shown in the Streamlit admin.
          path = Path('app_mobile_admin.py')
          text = path.read_text(encoding='utf-8')
          text = replace_exact(text, '    "NFL": "nfl-v4.7-touchdown-slot-matchups-2026-09-13",', '    "NFL": "nfl-v4.8-te1-yardage-2026-09-13",', 'admin NFL version')
          text = replace_exact(text, 'NFL includes regression game and QB/RB/WR yardage models.', 'NFL includes regression game and QB/RB/WR yardage models plus TE1 receiving-yard projections.', 'admin capability caption')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate TE1 production path
        shell: bash
        run: |
          python -m pip install --quiet numpy pandas
          python -m py_compile builders/nfl_builder.py builders/nfl_slot_matchups.py research/test_nfl_slot_matchups.py app_mobile_admin.py
          PYTHONPATH=. python research/test_nfl_slot_matchups.py
          python - <<'PY'
          from pathlib import Path
          builder = Path('builders/nfl_builder.py').read_text(encoding='utf-8')
          slot = Path('builders/nfl_slot_matchups.py').read_text(encoding='utf-8')
          assert '("TE1", ["TE"])' in builder
          assert '("TE", ["TE"])' not in builder
          assert '"TE1": 0.65' in builder
          assert '"WR3", "TE1"' in builder
          assert 'TRACKED_SLOTS = {"QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE1"}' in slot
          assert 'return "TE1" if raw == "TE" else raw' in slot
          assert '"Receiving Yards": {"RB1", "RB2", "WR1", "WR2", "WR3", "TE1"}' in slot
          print('NFL TE1 yardage validation passed')
          PY

      - name: Commit permanent source changes
        shell: bash
        run: |
          git config user.name "EZPZ NFL Model Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/install-nfl-te1-yardage.yml
          git add builders/nfl_builder.py builders/nfl_slot_matchups.py research/test_nfl_slot_matchups.py app_mobile_admin.py
          git commit -m "Add TE1 yardage projection tracking"
          git push origin HEAD:main
