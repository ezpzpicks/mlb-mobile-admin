name: One-time MLB post-save advance fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-mlb-post-save-advance.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply permanent MLB builder change
        run: python scripts/one_time_mlb_post_save_advance.py
      - name: Validate MLB builder
        run: |
          python -m py_compile builders/mlb_builder.py
          git diff --check
      - name: Commit permanent MLB builder change
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/mlb_builder.py
          git commit -m "Advance MLB builder cleanly after save"
          git push origin main
