name: NFL v4.2 odds inputs

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-odds-inputs-v42
    paths:
      - research/apply_nfl_odds_inputs_v42.py
      - research/apply_nfl_v42_app_version.py
      - .github/workflows/nfl-v42-odds-inputs.yml

permissions:
  contents: write

# This workflow materializes the reviewed exact-source patch onto the feature branch.
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-odds-inputs-v42
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply sportsbook line and price patch
        run: |
          python research/apply_nfl_odds_inputs_v42.py
          python research/apply_nfl_v42_app_version.py
      - name: Compile touched Python
        run: python -m py_compile builders/nfl_builder.py app_mobile_admin.py
      - name: Verify price-aware source guardrails
        run: |
          python - <<'PY'
          from pathlib import Path
          builder = Path('builders/nfl_builder.py').read_text(encoding='utf-8')
          app = Path('app_mobile_admin.py').read_text(encoding='utf-8')
          required = [
              '"Home Spread Odds"', '"Away Spread Odds"',
              '"Total Over Odds"', '"Total Under Odds"',
              'spread_price_edge', 'total_price_edge',
              'QB / RB / WR yard lines and prices',
              'spread_pick_odds, spread_implied',
              'total_pick_odds, total_implied',
          ]
          missing = [item for item in required if item not in builder]
          assert not missing, missing
          assert '("Spread", spread_pick, -110' not in builder
          assert '("Total", total_pick, -110' not in builder
          assert 'nfl-v4.2-price-aware-odds-2026-08-21' in app
          print('NFL v4.2 source guardrails passed')
          PY
      - name: Check diff
        run: git diff --check
      - name: Commit generated v4.2 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- builders/nfl_builder.py app_mobile_admin.py
          if ! git diff --cached --quiet; then
            git commit -m "NFL v4.2: add sportsbook line and side-price inputs"
            git pull --rebase origin nfl-odds-inputs-v42
            git push origin HEAD:nfl-odds-inputs-v42
          fi
