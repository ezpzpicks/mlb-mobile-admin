name: Diagnose ESPN depth chart API ordering

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-espn-depth-html.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect ESPN depth API
        shell: bash
        run: |
          python - <<'PY'
          import requests, json
          headers={"User-Agent":"EZPZ-Picks/1.0"}
          teams={"ATL":"1","PIT":"23"}
          for abbr,team_id in teams.items():
              url=f"https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/{team_id}/depthcharts"
              r=requests.get(url,headers=headers,timeout=30)
              print("TEAM",abbr,"status",r.status_code,"len",len(r.text))
              data=r.json()
              for chart in data.get("depthCharts",[]):
                  print("CHART", chart.get("name"), chart.get("displayName"), chart.get("type"))
                  positions=chart.get("positions",{})
                  items=list(positions.values()) if isinstance(positions,dict) else positions
                  for p in items:
                      info=p.get("position",{}) if isinstance(p,dict) else {}
                      pos=(info.get("abbreviation") or p.get("abbreviation") or "") if isinstance(p,dict) else ""
                      if pos not in {"QB","RB","HB","FB","WR","LWR","RWR","SWR","TE"}:
                          continue
                      print(" POSITION",pos,"key/order fields",{k:p.get(k) for k in p.keys() if k not in {"athletes","position"}})
                      for i,a in enumerate(p.get("athletes",[]),1):
                          ath=a.get("athlete",a)
                          print("  ",i,ath.get("displayName") or ath.get("fullName") or ath.get("name"),"entry rank",a.get("rank"),"entry slot",a.get("slot"),"entry keys",sorted(a.keys()),"ath status",ath.get("status"),"ath injuries",ath.get("injuries"))
              print("="*80)
          PY
