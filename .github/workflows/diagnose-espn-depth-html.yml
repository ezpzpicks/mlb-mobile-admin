name: Diagnose ESPN enriched athlete index

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-espn-depth-html.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect enriched athlete index
        shell: bash
        run: |
          python - <<'PY'
          import requests
          s=requests.Session(); s.headers.update({"User-Agent":"EZPZ-Picks/1.0"})
          urls=[
            "https://sports.core.api.espn.com/v3/sports/football/nfl/athletes?active=true&limit=2000",
            "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/athletes?active=true&limit=1000",
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/1/roster",
          ]
          for url in urls:
              r=s.get(url,timeout=60)
              print("URL",url,"STATUS",r.status_code,"LEN",len(r.text),"CT",r.headers.get("content-type"))
              print(r.text[:500])
              if r.status_code==200:
                  p=r.json()
                  print("TOP KEYS",list(p)[:20] if isinstance(p,dict) else type(p))
                  items=p.get("items",[]) if isinstance(p,dict) else []
                  print("ITEM COUNT",len(items))
                  if items:
                      print("FIRST ITEM",items[0])
              print("="*80)
          PY
