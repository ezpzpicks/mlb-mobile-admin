name: Apply CFB strict spread grades

on:
  push:
    branches: [main]
    paths:
      - "research/apply_cfb_strict_spread_grades.py"
      - ".github/workflows/apply-cfb-strict-spread-grades.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply stricter CFB spread thresholds
        run: python research/apply_cfb_strict_spread_grades.py
      - name: Commit threshold update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/cfb_market_calibration.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Tighten CFB spread grade thresholds"
          git push origin main
