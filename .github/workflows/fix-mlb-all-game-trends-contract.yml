name: Fix MLB all game trends contract

on:
  push:
    paths:
      - ".github/workflows/fix-mlb-all-game-trends-contract.yml"

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use shared all-game trends contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("builders/mlb_builder.py")
          text = path.read_text()

          local_tab = 'ALL_GAME_TRENDS_TAB = "all_game_trends"\n'
          if local_tab in text:
              text = text.replace(local_tab, "", 1)

          storage_import = "from shared.turso_storage import is_turso_ready, read_dataset, replace_dataset\n"
          contract_import = (
              "from shared.public_contract import (\n"
              "    ALL_GAME_TRENDS_COLUMNS,\n"
              "    ALL_GAME_TRENDS_TAB,\n"
              ")\n"
          )
          if contract_import not in text:
              if storage_import not in text:
                  raise SystemExit("Expected Turso storage import not found")
              text = text.replace(storage_import, contract_import + storage_import, 1)

          path.write_text(text)
          PY

      - name: Validate Python syntax
        run: python -m py_compile builders/mlb_builder.py shared/public_contract.py

      - name: Commit permanent source fix
        run: |
          if git diff --quiet -- builders/mlb_builder.py; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/mlb_builder.py
          git commit -m "Use shared all-game trends contract in MLB builder"
          git push
