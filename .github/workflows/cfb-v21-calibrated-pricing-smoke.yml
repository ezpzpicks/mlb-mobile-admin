name: CFB v2.1 calibrated pricing smoke

on:
  push:
    branches:
      - cfb-v21-calibrated-pricing
    paths:
      - builders/cfb_market_calibration.py
      - builders/cfb_builder.py
      - app_mobile_admin.py
      - research/apply_cfb_v21_calibrated_pricing.py
      - research/test_cfb_v21_market_calibration.py
      - .github/workflows/cfb-v21-calibrated-pricing-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - builders/cfb_market_calibration.py
      - builders/cfb_builder.py
      - app_mobile_admin.py
      - research/test_cfb_v21_market_calibration.py
      - .github/workflows/cfb-v21-calibrated-pricing-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfb-v21-calibrated-pricing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate calibrated pricing integration
        run: python research/apply_cfb_v21_calibrated_pricing.py
      - name: Compile integration
        run: python -m py_compile builders/cfb_market_calibration.py builders/cfb_builder.py app_mobile_admin.py research/test_cfb_v21_market_calibration.py
      - name: Run calibrated pricing smoke tests
        run: python -m research.test_cfb_v21_market_calibration
      - name: Check generated diff
        run: git diff --check
      - name: Record generated production source
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- builders/cfb_market_calibration.py builders/cfb_builder.py app_mobile_admin.py
          if ! git diff --cached --quiet; then
            git commit -m "Generate validated CFB v2.1 calibrated pricing source"
            git pull --rebase origin cfb-v21-calibrated-pricing
            git push origin HEAD:cfb-v21-calibrated-pricing
          fi
