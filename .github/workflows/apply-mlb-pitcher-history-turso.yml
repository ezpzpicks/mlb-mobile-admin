name: Apply MLB Pitcher History Turso Migration

on:
  push:
    branches:
      - turso-mlb-pitcher-history
    paths:
      - .github/workflows/apply-mlb-pitcher-history-turso.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-mlb-pitcher-history
          fetch-depth: 0

      - name: Apply pitcher-history storage change
        run: python scripts/apply_mlb_pitcher_history_turso.py

      - name: Validate Python syntax
        run: python -m py_compile shared/mlb_k_runtime_patch.py

      - name: Remove one-time migration files
        run: |
          rm scripts/apply_mlb_pitcher_history_turso.py
          rm .github/workflows/apply-mlb-pitcher-history-turso.yml

      - name: Commit migrated runtime storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/mlb_k_runtime_patch.py scripts/apply_mlb_pitcher_history_turso.py .github/workflows/apply-mlb-pitcher-history-turso.yml
          git diff --cached --check
          git commit -m "Mirror MLB pitcher history to Turso"
          git push origin HEAD:turso-mlb-pitcher-history
