name: CFB totals regression research

on:
  push:
    branches: [main]
    paths:
      - 'research/cfb_total_regression.py'
      - '.github/workflows/cfb-total-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make research runner robust
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/cfb_total_regression.py')
          text = path.read_text()
          old = '    beta = np.linalg.solve(design.T @ design + penalty, design.T @ y)'
          new = '    beta = np.linalg.lstsq(design, y, rcond=None)[0] if float(alpha) == 0.0 else np.linalg.solve(design.T @ design + penalty, design.T @ y)'
          if old in text:
              text = text.replace(old, new)
          text = text.replace('json.dumps(results, indent=2, allow_nan=False)', 'json.dumps(results, indent=2, allow_nan=True)')
          path.write_text(text)
          PY

      - name: Run leakage-safe totals backtest
        env:
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '0'
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python research/cfb_total_regression.py

      - name: Commit research results
        run: |
          if git diff --quiet -- research/cfb_total_regression.py research/results/cfb_total_regression_results.json research/results/CFB_TOTAL_REGRESSION_RESULTS.md; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/cfb_total_regression.py research/results/cfb_total_regression_results.json research/results/CFB_TOTAL_REGRESSION_RESULTS.md
          git commit -m 'research: record CFB totals regression holdout results'
          git push
