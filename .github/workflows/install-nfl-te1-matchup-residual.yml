name: Install NFL TE1 matchup residual

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-nfl-te1-matchup-residual.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install NFL TE1 matchup residual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add TE1-vs-all-TE residual learning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('builders/nfl_slot_matchups.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, 'MODEL_VERSION = "nfl-v4.8-te1-yardage-2026-09-13"', 'MODEL_VERSION = "nfl-v4.9-te1-yardage-matchups-2026-09-13"', 'slot model version')
          text = replace_once(
              text,
              '    frame["_team"] = nfl_builder._player_team_column(frame).map(nfl_builder._normalize_team)\n    frame["_player"] = nfl_builder._player_name_column(frame).map(nfl_builder._normalize_name)\n    frame["_opponent"] = nfl_builder._column(frame, "opponent_team", default="").map(nfl_builder._normalize_team)\n',
              '    frame["_team"] = nfl_builder._player_team_column(frame).map(nfl_builder._normalize_team)\n    frame["_player"] = nfl_builder._player_name_column(frame).map(nfl_builder._normalize_name)\n    frame["_opponent"] = nfl_builder._column(frame, "opponent_team", default="").map(nfl_builder._normalize_team)\n    frame["_position"] = nfl_builder._player_position_column(frame).map(nfl_builder._position_group)\n',
              'raw TE position normalization',
          )
          insert_anchor = '''        rows.append(part)\n\n    history = pd.concat(rows, ignore_index=True) if rows else pd.DataFrame(\n'''
          insert_block = '''        rows.append(part)\n\n    # TE1 is the only modeled tight-end depth slot, while the broad defensive\n    # TE matchup already includes every tight end on the opponent. Preserve\n    # that broad all-TE production as a pseudo-slot so TE1 can learn only the\n    # residual primary-TE tendency instead of double counting general TE weakness.\n    te_all = frame[frame["_position"].astype(str) == "TE"].copy()\n    if not te_all.empty:\n        te_all = te_all.groupby(["_week", "_team", "_opponent"], as_index=False).agg(\n            targets=("targets", "sum"),\n            receptions=("receptions", "sum"),\n            receiving_yards=("receiving_yards", "sum"),\n        )\n        for market, stat in (("Targets", "targets"), ("Receptions", "receptions"), ("Receiving Yards", "receiving_yards")):\n            rows.append(pd.DataFrame({\n                "season": season,\n                "week": pd.to_numeric(te_all["_week"], errors="coerce"),\n                "team": te_all["_team"].astype(str),\n                "opponent": te_all["_opponent"].astype(str),\n                "slot": "TE_ALL",\n                "player": "ALL TIGHT ENDS",\n                "market": market,\n                "actual": pd.to_numeric(te_all[stat], errors="coerce"),\n            }))\n\n    history = pd.concat(rows, ignore_index=True) if rows else pd.DataFrame(\n'''
          text = replace_once(text, insert_anchor, insert_block, 'TE_ALL history insertion')

          old_profile = '''    family_index = defense_family_avg / league_family if math.isfinite(league_family) and league_family > 0.20 else 1.0\n\n    # QB and TE each have a single slot. Their exact-slot tendency is already\n    # the broad position tendency, so applying it again would double count.\n    if len(family_slots) == 1:\n        outlier_index = 1.0\n    else:\n        outlier_index = absolute_index / max(family_index, 0.25)\n'''
          new_profile = '''    family_index = defense_family_avg / league_family if math.isfinite(league_family) and league_family > 0.20 else 1.0\n\n    if slot == "TE1":\n        broad_rows = market_rows[market_rows["slot"].astype(str) == "TE_ALL"].copy()\n        defense_broad = broad_rows[broad_rows["opponent"].astype(str) == opponent].copy()\n        league_broad = float(pd.to_numeric(broad_rows["actual"], errors="coerce").mean()) if not broad_rows.empty else math.nan\n        defense_broad_avg = float(pd.to_numeric(defense_broad["actual"], errors="coerce").mean()) if not defense_broad.empty else math.nan\n        if math.isfinite(league_broad) and league_broad > 0.20 and math.isfinite(defense_broad_avg):\n            family_index = defense_broad_avg / league_broad\n            outlier_index = absolute_index / max(family_index, 0.25)\n        else:\n            # Without an all-TE baseline, broad TE defense already owns this signal.\n            outlier_index = 1.0\n    elif len(family_slots) == 1:\n        # QB has no separate same-position depth slot to normalize against.\n        outlier_index = 1.0\n    else:\n        outlier_index = absolute_index / max(family_index, 0.25)\n'''
          text = replace_once(text, old_profile, new_profile, 'TE1 residual profile')
          path.write_text(text, encoding='utf-8')

          # Add synthetic TE1-vs-all-TE coverage to the focused validation.
          path = Path('research/test_nfl_slot_matchups.py')
          text = path.read_text(encoding='utf-8')
          old_rows = '''                _row(week, defense, "WR3", "Targets", 4.0, team),\n            ])\n'''
          new_rows = '''                _row(week, defense, "WR3", "Targets", 4.0, team),\n                _row(week, defense, "TE1", "Receiving Yards", 92.0 if defense == "NYG" else 45.0, team),\n                _row(week, defense, "TE_ALL", "Receiving Yards", 72.0 if defense == "NYG" else 55.0, team),\n            ])\n'''
          text = replace_once(text, old_rows, new_rows, 'TE1 test history')

          old_te_test = '''    # Single-slot positions are already handled by the broad position layer.\n    te_rows = pd.DataFrame([\n        _row(1, "NYG", "TE1", "Receiving Yards", 90.0, "A"),\n        _row(1, "DAL", "TE1", "Receiving Yards", 45.0, "B"),\n        _row(1, "PHI", "TE1", "Receiving Yards", 45.0, "C"),\n        _row(1, "WAS", "TE1", "Receiving Yards", 45.0, "D"),\n        _row(1, "GB", "TE1", "Receiving Yards", 45.0, "E"),\n        _row(1, "MIN", "TE1", "Receiving Yards", 45.0, "F"),\n        _row(1, "DET", "TE1", "Receiving Yards", 45.0, "G"),\n        _row(1, "CHI", "TE1", "Receiving Yards", 45.0, "H"),\n    ])\n    te = slot_model._profile_from_history(te_rows, "NYG", "TE1", "Receiving Yards")\n    assert te["adjustment_pct"] == 0.0\n'''
          new_te_test = '''    # TE1 now compares its exact production against the defense's all-TE\n    # allowance, so a primary-TE funnel can add a residual without double counting.\n    te = slot_model._profile_from_history(history, "NYG", "TE1", "Receiving Yards")\n    assert int(te["sample"]) == 3\n    assert te["defense_slot_avg"] > te["league_slot_avg"]\n    assert te["family_edge_pct"] > 0\n    assert te["slot_outlier_pct"] > 0\n    assert te["adjustment_pct"] > 0\n'''
          text = replace_once(text, old_te_test, new_te_test, 'TE1 residual validation')
          path.write_text(text, encoding='utf-8')

          for file_name in ('builders/nfl_builder.py', 'app_mobile_admin.py'):
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              text = replace_once(text, 'nfl-v4.8-te1-yardage-2026-09-13', 'nfl-v4.9-te1-yardage-matchups-2026-09-13', f'{file_name} version')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate TE1 residual model
        run: |
          python -m pip install --quiet numpy pandas
          python -m py_compile builders/nfl_slot_matchups.py builders/nfl_builder.py research/test_nfl_slot_matchups.py app_mobile_admin.py
          PYTHONPATH=. python research/test_nfl_slot_matchups.py

      - name: Commit permanent source changes
        shell: bash
        run: |
          git config user.name "EZPZ NFL Model Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/install-nfl-te1-matchup-residual.yml
          git add builders/nfl_slot_matchups.py builders/nfl_builder.py research/test_nfl_slot_matchups.py app_mobile_admin.py
          git commit -m "Learn TE1 yardage matchup residuals"
          git push origin HEAD:main
