name: CFB high-edge curve audit

on:
  push:
    branches:
      - audit-ncaaf-margin-2026-10-02
    paths:
      - 'research/cfb_high_edge_curve_audit.py'
      - '.github/workflows/cfb-high-edge-curve-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy pyreadr
      - name: Run high-edge curve audit
        env:
          PYTHONUNBUFFERED: '1'
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: '.'
        run: python research/cfb_high_edge_curve_audit.py
      - name: Commit results
        run: |
          git add research/results/cfb_high_edge_curve_audit.json research/results/CFB_HIGH_EDGE_CURVE_AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: persist CFB extended high-edge curve audit'
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
