name: Apply MLB Turso Direct Storage

on:
  push:
    branches:
      - turso-mlb-direct-storage
    paths:
      - .github/workflows/apply-mlb-turso-direct-storage.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-mlb-direct-storage
          fetch-depth: 0

      - name: Apply targeted MLB storage refactor
        run: python scripts/apply_mlb_turso_direct_storage.py

      - name: Validate Python syntax
        run: python -m py_compile builders/mlb_builder.py shared/turso_storage.py

      - name: Remove one-time migration files
        run: |
          rm scripts/apply_mlb_turso_direct_storage.py
          rm .github/workflows/apply-mlb-turso-direct-storage.yml

      - name: Commit migrated builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builders/mlb_builder.py scripts/apply_mlb_turso_direct_storage.py .github/workflows/apply-mlb-turso-direct-storage.yml
          git diff --cached --check
          git commit -m "Make MLB storage dual-write to Turso"
          git push origin HEAD:turso-mlb-direct-storage
