name: CFB power-reversal damping edge test

on:
  push:
    branches:
      - audit-ncaaf-margin-2026-10-02
    paths:
      - 'research/cfb_power_reversal_damping_edge_test.py'
      - '.github/workflows/cfb-power-reversal-damping-edge-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy
      - name: Run power-reversal damping test
        env:
          PYTHONUNBUFFERED: '1'
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: '.'
        run: python research/cfb_power_reversal_damping_edge_test.py
      - name: Commit results
        run: |
          git add research/results/cfb_power_reversal_damping_edge_test.json research/results/CFB_POWER_REVERSAL_DAMPING_EDGE_TEST.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: persist power-reversal damping edge test'
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
