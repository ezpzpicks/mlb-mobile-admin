name: CFB totals pace-efficiency regression

on:
  push:
    branches: [main]
    paths:
      - 'research/cfb_totals_efficiency_regression.py'
      - '.github/workflows/cfb-totals-efficiency-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make research data loading robust
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/cfb_totals_efficiency_regression.py')
          text = path.read_text()
          text = text.replace(
              '    seasons_needed = range(min(TRAIN_SEASONS) - 1, HOLDOUT_SEASON + 1)\n    games_cache = {season: games_from_pbp(season) for season in seasons_needed}',
              '    seasons_needed = range(min(TRAIN_SEASONS), HOLDOUT_SEASON + 1)\n    games_cache = {season: games_from_pbp(season) for season in seasons_needed}'
          )
          text = text.replace(
              '        prior_games = games_cache[season - 1]\n        prior_stats = team_summary(prior_games)\n        prior_pbp = original_open_pbp(season - 1)\n        current_pbp = original_open_pbp(season)',
              '        prior_games = games_cache.get(season - 1, pd.DataFrame())\n        prior_stats = team_summary(prior_games)\n        prior_pbp = original_open_pbp(season - 1) if season - 1 in games_cache else pd.DataFrame()\n        current_pbp = original_open_pbp(season)'
          )
          text = text.replace(
              '            prior_metric_frame = cfb._pbp_team_metrics(season - 1, None)\n            prior_metrics = metric_lookup(prior_metric_frame)',
              '            prior_metric_frame = cfb._pbp_team_metrics(season - 1, None) if not prior_pbp.empty else pd.DataFrame()\n            prior_metrics = metric_lookup(prior_metric_frame)'
          )
          old = '''    if out.empty:\n        raise RuntimeError(f"No completed games reconstructed for {season}")\n    return out.sort_values(["week", "game_id"]).drop_duplicates("game_id").reset_index(drop=True)'''
          new = '''    if out.empty:\n        espn = cfb._parse_games(cfb._espn_games_payload(int(season)), int(season))\n        if espn is not None and not espn.empty:\n            mask = espn["Completed"].map(cfb._bool)\n            mask &= pd.to_numeric(espn["Away Score"], errors="coerce").notna()\n            mask &= pd.to_numeric(espn["Home Score"], errors="coerce").notna()\n            mask &= pd.to_numeric(espn["Week"], errors="coerce").fillna(0).gt(0)\n            espn = espn.loc[mask].copy()\n            out = pd.DataFrame({\n                "season": int(season),\n                "week": pd.to_numeric(espn["Week"], errors="coerce").astype(int),\n                "game_id": espn["Game ID"].astype(str),\n                "away_team": espn["Away Team"].map(cfb._normalize_team),\n                "home_team": espn["Home Team"].map(cfb._normalize_team),\n                "neutral": espn["Neutral Site"].map(cfb._bool),\n                "away_score": pd.to_numeric(espn["Away Score"], errors="coerce"),\n                "home_score": pd.to_numeric(espn["Home Score"], errors="coerce"),\n                "market_total": pd.to_numeric(espn.get("Total"), errors="coerce"),\n                "market_home_spread": pd.to_numeric(espn.get("Home Spread"), errors="coerce"),\n            })\n            out["actual_total"] = out["away_score"] + out["home_score"]\n            out["actual_margin"] = out["home_score"] - out["away_score"]\n        if out.empty:\n            raise RuntimeError(f"No completed games reconstructed for {season}")\n    return out.sort_values(["week", "game_id"]).drop_duplicates("game_id").reset_index(drop=True)'''
          if old in text:
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Run totals-specific regression
        env:
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          EZPZ_CFB_CACHE_SECONDS: '86400'
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python research/cfb_totals_efficiency_regression.py

      - name: Commit research results
        run: |
          if git diff --quiet -- research/cfb_totals_efficiency_regression.py research/results/cfb_totals_efficiency_regression_results.json research/results/CFB_TOTALS_EFFICIENCY_REGRESSION.md; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/cfb_totals_efficiency_regression.py research/results/cfb_totals_efficiency_regression_results.json research/results/CFB_TOTALS_EFFICIENCY_REGRESSION.md
          git commit -m 'research: record CFB pace-efficiency totals holdout results'
          git push
