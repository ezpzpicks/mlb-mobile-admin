name: CFB totals pace-efficiency regression

on:
  push:
    branches: [main]
    paths:
      - 'research/cfb_totals_efficiency_regression.py'
      - '.github/workflows/cfb-totals-efficiency-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make research data loading robust
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/cfb_totals_efficiency_regression.py')
          text = path.read_text()
          text = text.replace(
              '"total": ("overUnder", "over_under", "total"),',
              '"total": ("overUnder", "over_under", "game_over_under", "total"),'
          )
          text = text.replace(
              '    seasons_needed = range(min(TRAIN_SEASONS) - 1, HOLDOUT_SEASON + 1)\n    games_cache = {season: games_from_pbp(season) for season in seasons_needed}',
              '    seasons_needed = range(min(TRAIN_SEASONS), HOLDOUT_SEASON + 1)\n    games_cache = {season: games_from_pbp(season) for season in seasons_needed}'
          )
          text = text.replace(
              '        prior_games = games_cache[season - 1]\n        prior_stats = team_summary(prior_games)\n        prior_pbp = original_open_pbp(season - 1)\n        current_pbp = original_open_pbp(season)',
              '        prior_games = games_cache.get(season - 1, pd.DataFrame())\n        prior_stats = team_summary(prior_games)\n        prior_pbp = original_open_pbp(season - 1) if season - 1 in games_cache else pd.DataFrame()\n        current_pbp = original_open_pbp(season)'
          )
          text = text.replace(
              '            prior_metric_frame = cfb._pbp_team_metrics(season - 1, None)\n            prior_metrics = metric_lookup(prior_metric_frame)',
              '            prior_metric_frame = cfb._pbp_team_metrics(season - 1, None) if not prior_pbp.empty else pd.DataFrame()\n            prior_metrics = metric_lookup(prior_metric_frame)'
          )

          marker = '    return out.sort_values(["week", "game_id"]).drop_duplicates("game_id").reset_index(drop=True)'
          enrichment = '''    # Evaluation-only market enrichment. PBP line fields are not stable across\n    # SportsDataverse seasons, so fill missing archived totals/spreads from the\n    # repo's ESPN historical schedule feed. These fields never enter predictors.\n    if not out.empty:\n        try:\n            espn_market = cfb._parse_games(cfb._espn_games_payload(int(season)), int(season))\n        except Exception as exc:\n            print(f"ESPN market enrichment failed for {season}: {exc}")\n            espn_market = pd.DataFrame()\n        if espn_market is not None and not espn_market.empty:\n            market = pd.DataFrame({\n                "_game_id": espn_market["Game ID"].astype(str),\n                "_week": pd.to_numeric(espn_market["Week"], errors="coerce"),\n                "_away": espn_market["Away Team"].map(cfb._normalize_team),\n                "_home": espn_market["Home Team"].map(cfb._normalize_team),\n                "_espn_total": pd.to_numeric(espn_market.get("Total"), errors="coerce"),\n                "_espn_spread": pd.to_numeric(espn_market.get("Home Spread"), errors="coerce"),\n            })\n            market.loc[market["_espn_total"] <= 0, "_espn_total"] = np.nan\n            market = market.drop_duplicates("_game_id")\n            total_by_id = market.set_index("_game_id")["_espn_total"]\n            spread_by_id = market.set_index("_game_id")["_espn_spread"]\n            out_ids = out["game_id"].astype(str)\n            current_total = pd.to_numeric(out.get("market_total"), errors="coerce")\n            current_spread = pd.to_numeric(out.get("market_home_spread"), errors="coerce")\n            id_total = out_ids.map(total_by_id)\n            id_spread = out_ids.map(spread_by_id)\n            out["market_total"] = current_total.where(current_total > 0).fillna(id_total)\n            out["market_home_spread"] = current_spread.fillna(id_spread)\n\n            # Team/week fallback protects against historical ID formatting changes.\n            market["_key"] = market["_week"].fillna(0).astype(int).astype(str) + "|" + market["_away"] + "|" + market["_home"]\n            total_by_key = market.drop_duplicates("_key").set_index("_key")["_espn_total"]\n            spread_by_key = market.drop_duplicates("_key").set_index("_key")["_espn_spread"]\n            out_key = pd.to_numeric(out["week"], errors="coerce").fillna(0).astype(int).astype(str) + "|" + out["away_team"].astype(str) + "|" + out["home_team"].astype(str)\n            out["market_total"] = pd.to_numeric(out["market_total"], errors="coerce").fillna(out_key.map(total_by_key))\n            out["market_home_spread"] = pd.to_numeric(out["market_home_spread"], errors="coerce").fillna(out_key.map(spread_by_key))\n        found = int(pd.to_numeric(out.get("market_total"), errors="coerce").notna().sum())\n        print(f"{season}: archived market totals recovered for {found}/{len(out)} games")\n    return out.sort_values(["week", "game_id"]).drop_duplicates("game_id").reset_index(drop=True)'''
          if 'archived market totals recovered for' not in text and marker in text:
              text = text.replace(marker, enrichment)
          path.write_text(text)
          PY

      - name: Run totals-specific regression
        env:
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          EZPZ_CFB_CACHE_SECONDS: '86400'
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python research/cfb_totals_efficiency_regression.py

      - name: Show totals grade results
        if: always()
        run: |
          echo '===== CFB TOTALS BACKTEST ====='
          if [ -f research/results/CFB_TOTALS_EFFICIENCY_REGRESSION.md ]; then
            cat research/results/CFB_TOTALS_EFFICIENCY_REGRESSION.md
          fi

      - name: Commit research results
        if: success()
        run: |
          if git diff --quiet -- research/cfb_totals_efficiency_regression.py research/results/cfb_totals_efficiency_regression_results.json research/results/CFB_TOTALS_EFFICIENCY_REGRESSION.md; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/cfb_totals_efficiency_regression.py research/results/cfb_totals_efficiency_regression_results.json research/results/CFB_TOTALS_EFFICIENCY_REGRESSION.md
          git commit -m 'research: record CFB totals grade holdout results'
          git push
