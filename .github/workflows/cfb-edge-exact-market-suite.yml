name: CFB exact-market edge-quality suite

on:
  push:
    branches:
      - audit-ncaaf-margin-2026-10-02
    paths:
      - 'research/cfb_edge_exact_market_runner.py'
      - 'research/cfb_historical_markets.py'
      - '.github/workflows/cfb-edge-exact-market-suite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        test: [recent, robust, power]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy statsmodels
      - name: Run edge-quality test
        env:
          PYTHONUNBUFFERED: '1'
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: '.'
        run: python research/cfb_edge_exact_market_runner.py ${{ matrix.test }}
      - name: Commit results
        run: |
          git add research/results || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "research: persist ${{ matrix.test }} exact-market edge search"
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
