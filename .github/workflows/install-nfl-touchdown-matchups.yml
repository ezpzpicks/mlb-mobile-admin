name: Install NFL touchdown matchup learning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-nfl-touchdown-matchups.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install NFL touchdown matchup learning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply permanent NFL touchdown matchup source changes
        run: python scripts/install_nfl_td_slot_v47.py

      - name: Correct TD normalization validation fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/test_nfl_slot_matchups.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '    proportional = td_history.copy()\n'
              '    nyg = proportional["opponent"] == "NYG"\n'
              '    proportional.loc[nyg, "actual"] = proportional.loc[nyg, "actual"] * 1.8\n'
              '    proportional_te = slot_model._profile_from_history(proportional, "NYG", "TE", "Anytime TD")\n'
              '    assert abs(proportional_te["adjustment_pct"]) < te_td["adjustment_pct"]\n'
          )
          new = (
              '    proportional = td_history.copy()\n'
              '    nyg = proportional["opponent"] == "NYG"\n'
              '    baseline = {"TE": 0.25, "WR1": 0.45, "WR2": 0.35, "WR3": 0.20, "RB1": 0.45, "RB2": 0.15, "QB": 0.15}\n'
              '    for slot, value in baseline.items():\n'
              '        mask = nyg & (proportional["slot"] == slot)\n'
              '        proportional.loc[mask, "actual"] = value * 1.8\n'
              '    proportional_te = slot_model._profile_from_history(proportional, "NYG", "TE", "Anytime TD")\n'
              '    assert abs(proportional_te["adjustment_pct"]) < 0.01\n'
          )
          if old not in text:
              raise SystemExit('TD normalization fixture anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused validation
        run: |
          python -m pip install --quiet numpy pandas
          python -m py_compile builders/nfl_slot_matchups.py app_mobile_admin.py research/test_nfl_slot_matchups.py
          PYTHONPATH=. python research/test_nfl_slot_matchups.py

      - name: Commit permanent source changes
        shell: bash
        run: |
          git config user.name "EZPZ NFL Model Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/install-nfl-touchdown-matchups.yml scripts/install_nfl_td_slot_v47.py
          git add builders/nfl_slot_matchups.py research/test_nfl_slot_matchups.py app_mobile_admin.py
          git commit -m "Add TD slot and red-zone matchup learning"
          git push origin HEAD:main
