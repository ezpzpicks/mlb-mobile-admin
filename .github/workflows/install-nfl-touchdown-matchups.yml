name: Install NFL touchdown matchup learning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-nfl-touchdown-matchups.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install NFL touchdown matchup learning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply permanent NFL touchdown matchup source changes
        run: python scripts/install_nfl_td_slot_v47.py

      - name: Run focused validation
        run: |
          python -m pip install --quiet numpy pandas
          python -m py_compile builders/nfl_slot_matchups.py app_mobile_admin.py research/test_nfl_slot_matchups.py
          PYTHONPATH=. python research/test_nfl_slot_matchups.py

      - name: Commit permanent source changes
        shell: bash
        run: |
          git config user.name "EZPZ NFL Model Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/install-nfl-touchdown-matchups.yml scripts/install_nfl_td_slot_v47.py
          git add builders/nfl_slot_matchups.py research/test_nfl_slot_matchups.py app_mobile_admin.py
          git commit -m "Add TD slot and red-zone matchup learning"
          git push origin HEAD:main
