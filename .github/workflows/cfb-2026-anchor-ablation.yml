name: CFB 2026 anchor ablation

on:
  push:
    branches:
      - audit-ncaaf-margin-2026-10-02
    paths:
      - 'research/cfb_2026_anchor_ablation.py'
      - '.github/workflows/cfb-2026-anchor-ablation.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas pyarrow polars requests streamlit scipy pyreadr
      - name: Run anchor ablation
        env:
          PYTHONUNBUFFERED: '1'
          EZPZ_CFB_ALLOW_BLOCKING_OPEN_DATA: '1'
          PYTHONPATH: '.'
        run: python research/cfb_2026_anchor_ablation.py
      - name: Commit results
        run: |
          git add research/results/cfb_2026_anchor_ablation.json research/results/CFB_2026_ANCHOR_ABLATION.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: persist CFB 2026 anchor ablation'
          git pull --rebase origin audit-ncaaf-margin-2026-10-02
          git push
