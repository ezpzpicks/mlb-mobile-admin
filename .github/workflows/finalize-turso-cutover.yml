name: Finalize Turso cutover

on:
  push:
    branches: [turso-full-cutover]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-full-cutover
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize permanent source and remove Google runtime
        run: PYTHONPATH=. python scripts/finalize_turso_cutover.py
      - name: Verify Python source
        run: |
          python -m py_compile app_mobile_admin.py public_app.py sitecustomize.py shared/storage.py shared/turso_storage.py builders/mlb_builder.py builders/nfl_builder.py builders/cfb_builder.py builders/cbb_builder.py
          if grep -R -nE 'import gspread|google\.oauth2|GOOGLE_CREDENTIALS|GOOGLE_SHEET_NAME' app_mobile_admin.py public_app.py sitecustomize.py shared builders --include='*.py'; then
            echo 'Google Sheets runtime references remain'
            exit 1
          fi
      - name: Commit permanent finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Finalize Turso-only admin storage"
          git push origin HEAD:turso-full-cutover
